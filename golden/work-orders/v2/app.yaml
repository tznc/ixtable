    name: Operations
    filters:
      - { id: 01a1016b-bbd6-702c-a5da-1dcb0da71ced, name: Priority, param: priority, logicalType: text, control: select, optionsQueryId: 01a1016b-bbd4-72fa-aca3-9614ac9e7e6f }  # wo-filter-priority
    components:
      - { id: 01a1016b-bbb9-7f0b-93d9-b46d9dc14efb, kind: filter, title: Priority, filterId: 01a1016b-bbd6-702c-a5da-1dcb0da71ced, placement: { column: 1, row: 1, columnSpan: 4 } }
      - { id: 01a1016b-bbba-7527-b972-a37ac2057e06, kind: kpi, title: Open work orders, queryId: 01a1016b-bbe5-76d3-9440-d5e27f03276f, expression: count(rows.number), format: "#,##0", placement: { column: 1, row: 2, columnSpan: 4 } }
      - { id: 01a1016b-bbbb-7705-b8e0-2e418abb3c80, kind: kpi, title: Urgent, queryId: 01a1016b-bbe5-76d3-9440-d5e27f03276f, expression: "countof(rows, priority = 'Urgent')", format: "#,##0", placement: { column: 5, row: 2, columnSpan: 4 } }
      - { id: 01a1016b-bbbc-7db2-bec3-28473787fd08, kind: kpi, title: Average progress (%), queryId: 01a1016b-bbe5-76d3-9440-d5e27f03276f, expression: "round(avg(rows.progress), 0)", format: "0", placement: { column: 9, row: 2, columnSpan: 2 } }
      - { id: 01a1016b-bbfc-7b8a-bbc2-34fbde1978ce, kind: kpi, title: Overdue, queryId: 01a1016b-bbe5-76d3-9440-d5e27f03276f, expression: "countof(rows, not isnull(due_on) and due_on < today())", format: "#,##0", placement: { column: 11, row: 2, columnSpan: 2 } }
      - { id: 01a1016b-bbbd-7731-8c42-4f991535c4e4, kind: chart, title: Work orders by status, queryId: 01a1016b-bbec-72c2-ad92-de12b83e0fc4, chartType: bar, x: status, y: [work_orders], placement: { column: 1, row: 3, columnSpan: 5, rowSpan: 2 } }
      - id: 01a1016b-bbbe-711d-903a-b9d1df829bb2
        kind: table
        title: Open work order list
        queryId: 01a1016b-bbe5-76d3-9440-d5e27f03276f
        columns: [number, title, asset, priority, status, assignee, progress, due_on]
        pageSize: 10
        placement: { column: 6, row: 3, columnSpan: 7, rowSpan: 2 }
actions:
  - id: 01a1016b-bbea-709e-a7ee-3b15a997f87c  # wo-action-start
    name: Start work order
    description: Moves an assigned, open work order to In progress and logs it.
    onError: rollback
    steps:
      - id: 01a1016b-bbbf-7b32-98df-69c968fcab66
        kind: condition
        when: "record.status_code = 'open' and not isnull(record.assignee_id)"
        then:
          - id: 01a1016b-bbc0-7e8e-9ae3-23e359b5cafb
            kind: updateRecord
            table: work_orders
            match:
              id: record.id
              status_code: "'open'"
            values:
              status_code: "'in_progress'"
              started_on: today()
          - id: 01a1016b-bbc1-7c0d-a0e2-d103d00b8d52
            kind: createRecord
            table: work_order_log
            values:
              work_order_id: record.id
              event: "'started'"
              message: "'Work started on ' & record.number"
          - id: 01a1016b-bbc2-7f29-8891-6f03c3a33d98
            kind: message
            text: "'Work order started.'"
        else:
          - id: 01a1016b-bbc3-7c48-b0fa-53a286c12c60
            kind: message
            tone: error
            text: "if(record.status_code <> 'open', 'Only open work orders can be started.', 'Assign someone before starting this work order.')"
  - id: 01a1016b-bbd7-7de2-96d2-0e869063ea09  # wo-action-complete
    name: Complete work order
    description: Moves an in-progress work order with no open tasks to Done and logs it.
    onError: rollback
    steps:
      - id: 01a1016b-bbc4-74b9-8a5c-ba97dc94338b
        kind: runQuery
        queryId: 01a1016b-bbe9-7787-ac9d-a25fbf140c4c
        params:
          work_order_id: record.id
        storeAs: open
      - id: 01a1016b-bbc5-7c94-9625-3751040e0e72
        kind: condition
        when: "record.status_code = 'in_progress' and sum(results.open.open_tasks) = 0"
        then:
          - id: 01a1016b-bbc6-7fe3-a288-732cd77ee6c0
            kind: updateRecord
            table: work_orders
            match:
              id: record.id
              status_code: "'in_progress'"
            values:
              status_code: "'done'"
              completed_on: today()
              progress: "100"
          - id: 01a1016b-bbc7-75db-89b8-aac6670c740d
            kind: createRecord
            table: work_order_log
            values:
              work_order_id: record.id
              event: "'completed'"
              message: "'Work completed on ' & record.number"
          - id: 01a1016b-bbc8-7070-9445-0ee29af4fdeb
            kind: message
            text: "'Work order completed.'"
        else:
          - id: 01a1016b-bbc9-7308-b22c-72ac082c736e
            kind: message
            tone: error
            text: "if(record.status_code <> 'in_progress', 'Start the work order before completing it.', 'Finish every task before completing: ' & sum(results.open.open_tasks) & ' still open.')"
  - id: 01a1016b-bbe6-7f87-94fb-88c6a06c4738  # wo-action-print
    name: Print work order sheet
    onError: stop
    steps:
      - id: 01a1016b-bbca-7c2c-a7ca-d84c6b1910a5
        kind: openReport
        reportId: 01a1016b-bbe7-774e-b9b9-2cb9c2f58f92
        params:
          number: record.number
  - id: 01a1016b-bbdd-7207-b758-bfd46fc01e3e  # wo-action-progress
    name: Recompute work-order progress
    description: Sets the work order's progress to the share of its tasks that are done.
    onError: stop
    steps:
      - id: 01a1016b-bbcb-76cd-bc6c-3a13b848a151
        kind: runQuery
        queryId: 01a1016b-bbdb-776f-85bc-fba749d41fb4
        params:
          work_order_id: record.work_order_id
        storeAs: progress
      - id: 01a1016b-bbcc-7acb-aba0-54545df78e08
        kind: updateRecord
        table: work_orders
        match:
          id: record.work_order_id
        values:
          progress: coalesce(max(results.progress.pct), 0)
  - id: 01a1016b-bbd2-7f48-88ee-bd92ac3d2ff2  # wo-action-log-created
    name: Log new work order
    description: Background job that writes the audit row for a new work order.
    onError: stop
    steps:
      - id: 01a1016b-bbcd-74a8-b32f-69e441b3a224
        kind: createRecord
        table: work_order_log
        values:
          work_order_id: record.id
          event: "'created'"
          message: "'Work order ' & record.number & ' opened: ' & record.title"
triggers:
  - id: 01a1016b-bbd0-7f56-b0f1-408ebadbb05f  # wo-trigger-task-created
    name: Recompute progress when a task is added
    table: tasks
    event: created
    actionId: 01a1016b-bbdd-7207-b758-bfd46fc01e3e
