        expression: sum(rows.deals)
        format: "#,##0"
        placement: { column: 5, row: 2, columnSpan: 4 }
      - id: 01a100fd-deb5-7208-b8d3-254a502405b2
        kind: chart
        title: Pipeline by stage
        queryId: 01a100fd-dec5-7021-bf07-58f8d6eefb7f
        chartType: bar
        x: stage
        y: [total]
        format: "$#,##0"
        placement: { column: 1, row: 3, columnSpan: 8, rowSpan: 2 }
      - id: 01a100fd-deb6-7d9e-a7b6-d9054f9f629e
        kind: table
        title: Open deal list
        queryId: 01a100fd-ded9-704a-8479-c35c56a14fde
        columns: [title, company, stage, amount]
        pageSize: 10
        placement: { column: 9, row: 2, columnSpan: 4, rowSpan: 3 }
actions:
  - id: 01a100fd-dec8-7447-bac5-36865210bf78  # crm-action-mark-won
    name: Mark deal won
    description: Moves an open deal to the Won stage and logs an activity, in one transaction.
    onError: rollback
    steps:
      - id: 01a100fd-deb7-7b2a-b313-7c91447e670f
        kind: runQuery
        queryId: 01a100fd-dedc-7843-b7b6-8e10fb4812d0
        params: {}
        storeAs: won
      - id: 01a100fd-deb8-7450-a812-0074979bc696
        kind: condition
        when: "record.status = 'open'"
        then:
          - id: 01a100fd-deb9-7d1c-bbc7-19c9fd4f6c32
            kind: updateRecord
            table: deals
            match: current
            values:
              status: "'won'"
              stage_id: max(results.won.id)
              close_date: coalesce(record.close_date, today())
          - id: 01a100fd-deba-7be5-b87b-085cffaad2d8
            kind: createRecord
            table: activities
            values:
              company_id: record.company_id
              deal_id: record.id
              contact_id: record.contact_id
              kind: "'note'"
              subject: "'Deal won: ' & record.title"
              due_date: today()
              done: "1"
          - id: 01a100fd-debb-7b53-a4aa-022f2da6f98e
            kind: message
            text: "'Deal marked as won.'"
        else:
          - id: 01a100fd-debc-75f8-b104-54be02ecf027
            kind: message
            text: "'Only open deals can be marked won.'"
            tone: error
  - id: 01a100fd-debe-7dfd-8498-03b3edb6f7cf  # crm-action-log-new-deal
    name: Log new deal
    description: Records a note activity when a deal is created.
    onError: stop
    steps:
      - id: 01a100fd-debd-7ee4-93c0-8eb64ebd80b5
        kind: createRecord
        table: activities
        values:
          company_id: record.company_id
          deal_id: record.id
          contact_id: record.contact_id
          kind: "'note'"
          subject: "'Deal created: ' & record.title"
          due_date: today()
          done: "1"
triggers:
  - id: 01a100fd-dec3-7f42-8322-ac40894a07a4  # crm-trigger-new-deal
    name: Log activity when a deal is created
    table: deals
    event: created
    actionId: 01a100fd-debe-7dfd-8498-03b3edb6f7cf
    mode: sync
    enabled: true
