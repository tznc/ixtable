      - { id: 01a10134-cd39-78e3-a497-ff78d2f7c846, kind: filter, title: Location, filterId: 01a10134-cd4e-7fe6-957f-0fa091463f52, placement: { column: 1, row: 1, columnSpan: 4 } }
      - { id: 01a10134-cd3a-7d50-9bb9-eb0961e5e8d7, kind: kpi, title: Low-stock items, queryId: 01a10134-cd68-7ccb-9efa-9ddbf5057e7c, expression: count(rows.sku), format: "#,##0", placement: { column: 1, row: 2, columnSpan: 4 } }
      - { id: 01a10134-cd3b-7d66-bd36-4a1dff84e200, kind: kpi, title: Inventory value, queryId: 01a10134-cd60-77c7-bbdf-1f10ecd8ba9f, expression: sum(rows.value), format: "$#,##0.00", placement: { column: 5, row: 2, columnSpan: 4 } }
