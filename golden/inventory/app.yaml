actions:
  - id: 01a10134-cd46-7b77-a46c-600c139722f8  # inv-action-post-transfer
    name: Post transfer
    description: Moves stock between locations as one transaction (transfer in, transfer out, posted status).
    onError: rollback
    steps:
      - id: 01a10134-cd3f-7a6b-a54d-17d8c8653365
        kind: runQuery
        queryId: 01a10134-cd63-79e8-8db2-dcf6a19b2442
        params:
          product_id: record.product_id
          location_id: record.from_location_id
        storeAs: source
      - id: 01a10134-cd40-7aa6-b5d2-242adb54a91b
        kind: condition
        when: "record.status = 'draft' and coalesce(sum(results.source.on_hand), 0) >= record.quantity"
        then:
          - id: 01a10134-cd41-7ac4-bbb6-8dd0fc72c175
            kind: createRecord
            table: stock_movements
            values:
              product_id: record.product_id
              location_id: record.to_location_id
              quantity: record.quantity
              kind: "'transfer_in'"
              reference: "'TR-' & record.id"
              moved_on: today()
          - id: 01a10134-cd42-7e8b-8071-4a7f64619b24
            kind: createRecord
            table: stock_movements
            values:
              product_id: record.product_id
              location_id: record.from_location_id
              quantity: -record.quantity
              kind: "'transfer_out'"
              reference: "'TR-' & record.id"
              moved_on: today()
          - id: 01a10134-cd43-7022-96c8-ee193bba15e2
            kind: updateRecord
            table: transfers
            match:
              id: record.id
              status: "'draft'"
            values:
              status: "'posted'"
              posted_on: today()
          - id: 01a10134-cd44-73c8-9202-c84be7392a44
            kind: message
            text: "'Transfer posted.'"
        else:
          - id: 01a10134-cd45-7602-ba2a-62947024fec6
            kind: fail
            message: "if(record.status <> 'draft', 'This transfer is already posted.', 'Not enough stock at the source location: ' & coalesce(sum(results.source.on_hand), 0) & ' on hand.')"
