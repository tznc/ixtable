# Inventory management golden application (PRD §26.3).
# Pure definition data: the same DocumentConfig YAML the Settings › YAML tab edits.
# {{asset:<file>}} placeholders are replaced with the ids of the template's assets
# when a document is created from the template.
# Object ids are fixed UUIDv7 literals. A trailing comment names each top-level object.
version: 5
name: Inventory
activeMode: run
settings:
  template: inventory
  description: Products, locations, suppliers, stock movements with transactional transfers, low-stock alerts, and a valuation report.
release:
  version: 1.0.0
  notes: Golden inventory template.
datasource:
  kind: sqlite
  id: 01a10134-cef4-7f05-8cec-f83aa99cdf93  # inv-datasource
entities:
  - { id: 01a10134-cd4c-70d2-89ce-e69f0fc06bbe, table: suppliers, concurrency: optimistic }  # inv-entity-suppliers
  - { id: 01a10134-cd49-7695-b45d-6028964b8000, table: locations, concurrency: optimistic }  # inv-entity-locations
  - { id: 01a10134-cd4f-769f-a071-8e9100d500de, table: products, concurrency: optimistic }  # inv-entity-products
  - { id: 01a10134-cd4a-7530-84aa-b03c79842bea, table: stock_movements, concurrency: lastWriteWins }  # inv-entity-movements
  - { id: 01a10134-cd47-74ee-bee7-13a7d2d484fc, table: reorder_thresholds, concurrency: optimistic }  # inv-entity-thresholds
  - { id: 01a10134-cd48-775e-bb09-4de1b4e6e248, table: transfers, concurrency: optimistic }  # inv-entity-transfers
migrations:
  - id: 01a10134-cd6a-7b26-8145-42ab80b1cbee  # inv-001-schema
    name: 001 Create inventory schema
    order: 1
    targetStore: sqlite
    up: |
      CREATE TABLE suppliers (
        id INTEGER PRIMARY KEY,
        name TEXT NOT NULL UNIQUE,
        email TEXT,
        phone TEXT,
        lead_time_days INTEGER NOT NULL DEFAULT 7 CHECK (lead_time_days >= 0)
      );
      CREATE TABLE locations (
        id INTEGER PRIMARY KEY,
        code TEXT NOT NULL UNIQUE,
        name TEXT NOT NULL,
        kind TEXT NOT NULL DEFAULT 'warehouse' CHECK (kind IN ('warehouse', 'store', 'transit'))
      );
      CREATE TABLE products (
        id INTEGER PRIMARY KEY,
        sku TEXT NOT NULL UNIQUE CHECK (length(sku) >= 3),
        name TEXT NOT NULL,
        supplier_id INTEGER REFERENCES suppliers(id) ON DELETE SET NULL,
        unit_cost REAL NOT NULL DEFAULT 0 CHECK (unit_cost >= 0),
        unit TEXT NOT NULL DEFAULT 'each',
        active INTEGER NOT NULL DEFAULT 1 CHECK (active IN (0, 1))
      );
      CREATE TABLE stock_movements (
        id INTEGER PRIMARY KEY,
        product_id INTEGER NOT NULL REFERENCES products(id) ON DELETE CASCADE,
        location_id INTEGER NOT NULL REFERENCES locations(id) ON DELETE RESTRICT,
        quantity INTEGER NOT NULL CHECK (quantity <> 0),
        kind TEXT NOT NULL CHECK (kind IN ('receipt', 'issue', 'transfer_in', 'transfer_out', 'adjustment')),
        reference TEXT,
        moved_on DATE NOT NULL DEFAULT (date('now')),
        note TEXT
      );
      CREATE TABLE reorder_thresholds (
        product_id INTEGER NOT NULL REFERENCES products(id) ON DELETE CASCADE,
        location_id INTEGER NOT NULL REFERENCES locations(id) ON DELETE CASCADE,
        min_quantity INTEGER NOT NULL CHECK (min_quantity >= 0),
        reorder_quantity INTEGER NOT NULL DEFAULT 0 CHECK (reorder_quantity >= 0),
        PRIMARY KEY (product_id, location_id)
      );
      CREATE TABLE transfers (
        id INTEGER PRIMARY KEY,
        product_id INTEGER NOT NULL REFERENCES products(id) ON DELETE CASCADE,
        from_location_id INTEGER NOT NULL REFERENCES locations(id),
        to_location_id INTEGER NOT NULL REFERENCES locations(id),
        quantity INTEGER NOT NULL CHECK (quantity > 0),
        status TEXT NOT NULL DEFAULT 'draft' CHECK (status IN ('draft', 'posted')),
        requested_on DATE NOT NULL DEFAULT (date('now')),
        posted_on DATE,
        CHECK (status <> 'posted' OR from_location_id <> to_location_id)
      );
      CREATE INDEX movements_product_location ON stock_movements(product_id, location_id);
      CREATE INDEX products_supplier ON products(supplier_id);
savedQueries:
  - id: 01a10134-cd6d-70c0-858d-e120a781be0b  # inv-q-on-hand
    name: Stock on hand
    sql: |
      SELECT p.sku, p.name AS product, l.code AS location, sum(m.quantity) AS on_hand
      FROM stock_movements m
      JOIN products p ON p.id = m.product_id
      JOIN locations l ON l.id = m.location_id
      WHERE ($location IS NULL OR l.code = $location)
      GROUP BY p.sku, p.name, l.code
      ORDER BY p.sku, l.code
    parameters:
      - { name: location, logicalType: text }
  - id: 01a10134-cd64-7bf0-85e8-473235e45958  # inv-q-by-product
    name: Stock by product
    sql: |
      SELECT p.sku, p.name AS product, coalesce(sum(m.quantity), 0) AS on_hand
      FROM products p LEFT JOIN stock_movements m ON m.product_id = p.id
      GROUP BY p.sku, p.name
      ORDER BY p.sku
  - id: 01a10134-cd60-77c7-bbdf-1f10ecd8ba9f  # inv-q-by-location
    name: Stock by location
    sql: |
      SELECT l.code AS location, sum(m.quantity) AS units, sum(m.quantity * p.unit_cost) AS value
      FROM stock_movements m
      JOIN locations l ON l.id = m.location_id
      JOIN products p ON p.id = m.product_id
      WHERE ($location IS NULL OR l.code = $location)
      GROUP BY l.code
      ORDER BY l.code
    parameters:
      - { name: location, logicalType: text }
  - id: 01a10134-cd67-77f9-8459-c11337e9e44e  # inv-q-valuation
    name: Inventory valuation
    sql: |
      SELECT coalesce(s.name, 'No supplier') AS supplier, p.sku, p.name AS product,
        coalesce(sum(m.quantity), 0) AS on_hand, p.unit_cost,
        coalesce(sum(m.quantity), 0) * p.unit_cost AS value
      FROM products p
      LEFT JOIN suppliers s ON s.id = p.supplier_id
      LEFT JOIN stock_movements m ON m.product_id = p.id
      GROUP BY s.name, p.sku, p.name, p.unit_cost
      ORDER BY supplier, p.sku
  - id: 01a10134-cd68-7ccb-9efa-9ddbf5057e7c  # inv-q-low-stock
    name: Low stock
    sql: |
      SELECT p.sku, p.name AS product, l.code AS location,
        coalesce(s.on_hand, 0) AS on_hand, t.min_quantity, t.reorder_quantity
      FROM reorder_thresholds t
      JOIN products p ON p.id = t.product_id
      JOIN locations l ON l.id = t.location_id
      LEFT JOIN (
        SELECT product_id, location_id, sum(quantity) AS on_hand
        FROM stock_movements GROUP BY product_id, location_id
      ) s ON s.product_id = t.product_id AND s.location_id = t.location_id
      WHERE coalesce(s.on_hand, 0) < t.min_quantity
        AND ($location IS NULL OR l.code = $location)
      ORDER BY p.sku, l.code
    parameters:
      - { name: location, logicalType: text }
  - id: 01a10134-cd63-79e8-8db2-dcf6a19b2442  # inv-q-on-hand-at
    name: On hand at location
    sql: |
      SELECT coalesce(sum(quantity), 0) AS on_hand
      FROM stock_movements
      WHERE product_id = $product_id AND location_id = $location_id
    parameters:
      - { name: product_id, logicalType: integer, required: true }
      - { name: location_id, logicalType: integer, required: true }
  - id: 01a10134-cd4b-774a-a96e-6e92dd8f44fd  # inv-q-location-codes
    name: Location codes
    sql: SELECT code FROM locations ORDER BY code
