# Supabase CLI configuration for the ixtable Cloud control plane.
# Local development and service-qa only: `node scripts/cloud/up.mjs`.
# Production settings live in the hosted project; never point tests at it.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "ixtable"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 54323
api_url = "http://127.0.0.1"

# Mailpit captures invitation and recovery mail locally (web UI on :54324).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Must be at least the largest bucket limit (PRD §7.4: 500 MB per archive).
file_size_limit = "500MiB"

# Archives (developer versions and installation backups). Private: clients
# never read or write objects directly. Edge Functions mint signed URLs.
[storage.buckets.app-archives]
public = false
file_size_limit = "500MiB"
allowed_mime_types = ["application/octet-stream", "application/zip", "application/x-ixtable"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = [
  "http://127.0.0.1:3001",
  "http://127.0.0.1:3001/**",
  "http://localhost:3001",
  "http://localhost:3001/**",
  "http://127.0.0.1:3001/desktop-auth",
  "http://127.0.0.1:3001/auth/callback",
  "http://127.0.0.1:3001/invitations/accept",
  "http://127.0.0.1:3001/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

# Local limits are loose so service-qa can create many throwaway users.
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_refresh = 1000
token_verifications = 1000
anonymous_users = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only: password sign-up returns a session immediately. Production
# enables confirmations in the hosted project settings.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

# OAuth providers (PRD §21.1). Disabled locally because they need real client
# credentials. To try one locally: create an OAuth client whose redirect URI is
# http://127.0.0.1:54321/auth/v1/callback, export the two env vars below
# (or put them in supabase/.env), set enabled = true, and restart the stack.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Microsoft sign-in uses the Supabase "azure" provider. `url` is the tenant
# endpoint; "common" accepts personal and work accounts.
[auth.external.azure]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
url = "https://login.microsoftonline.com/common/v2.0"

[edge_runtime]
enabled = true
# `oneshot` serves edits without restart and avoids per-worker state leaking
# between requests during service-qa.
policy = "oneshot"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false

# Functions not listed here use verify_jwt = true (the gateway rejects calls
# without a valid Supabase JWT). Functions below authenticate in code.

# Public liveness probe used by monitoring and the service-qa health gate.
[functions.health]
verify_jwt = false

# Stripe calls this directly; the Stripe-Signature HMAC is the authentication.
[functions.stripe-webhook]
verify_jwt = false

# The desktop polls this before it has a session; the PKCE verifier is the
# authentication.
[functions.desktop-auth-exchange]
verify_jwt = false

# Credentials and desktop sign-in (C1b). These authenticate the caller in code
# as well; the gateway check is defense in depth.
[functions.credential-envelope]
verify_jwt = true

[functions.credential-delete]
verify_jwt = true

[functions.key-grant]
verify_jwt = true

[functions.devices-revoke]
verify_jwt = true

[functions.desktop-auth-approve]
verify_jwt = true

# Distribution (apps, roles, invitations, members, archives, versions,
# bundles, sync, backups). Each also authenticates the caller in code.
[functions.apps-create]
verify_jwt = true

[functions.apps-delete]
verify_jwt = true

[functions.apps-transfer]
verify_jwt = true

[functions.roles-sync]
verify_jwt = true

[functions.invitations-create]
verify_jwt = true

[functions.invitations-accept]
verify_jwt = true

[functions.members-update]
verify_jwt = true

[functions.app-access-update]
verify_jwt = true

[functions.archive-upload-url]
verify_jwt = true

[functions.publish-checkpoint]
verify_jwt = true

[functions.versions-resolve]
verify_jwt = true

[functions.restore-url]
verify_jwt = true

[functions.bundle-manifest]
verify_jwt = true

[functions.sync-check]
verify_jwt = true

[functions.backup-commit]
verify_jwt = true

# Scheduler only: the service role key (Bearer) or the CRON_SECRET header is
# checked in code, so a non-JWT scheduler secret also works.
[functions.retention-sweep]
verify_jwt = false
