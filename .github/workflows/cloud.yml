name: Cloud contracts

# ixtable Cloud contract tests against a real local Supabase stack (PRD §26.5):
# Edge Function Deno unit tests, the service-qa API contract specs (RLS
# private-by-default, revocation, key grants, backups, billing), and the desktop
# cloud integration tests (Rust, headless UI). Ubuntu only: the stack
# runs in Docker, and the desktop side is covered on every OS by desktop.yml.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/cloud/**'
      - 'src-tauri/src/ui/cloud/**'
      - 'src-tauri/src/cloud/**'
      - 'src-tauri/src/bundle*.rs'
      - 'src-tauri/src/installation*.rs'
      - 'src-tauri/Cargo.lock'
      - 'web/e2e/service-qa/**'
      - 'web/playwright.service-qa.config.ts'
      - '.github/workflows/cloud.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/cloud/**'
      - 'src-tauri/src/ui/cloud/**'
      - 'src-tauri/src/cloud/**'
      - 'src-tauri/src/bundle*.rs'
      - 'src-tauri/src/installation*.rs'
      - 'src-tauri/Cargo.lock'
      - 'web/e2e/service-qa/**'
      - 'web/playwright.service-qa.config.ts'
      - '.github/workflows/cloud.yml'

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  contracts:
    name: Cloud contracts (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
        with:
          cache-key: cloud
          npm-cache-paths: |
            web/package-lock.json
            supabase/functions/package-lock.json
      # Pinned to the CLI version the stack is developed against. A maintainer
      # should also pin this action to a commit SHA.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      # Generates supabase/functions/.env.local (dev-only secrets), starts the
      # stack, resets the database, and waits for /functions/v1/health.
      - name: Start local Supabase stack
        run: node scripts/cloud/up.mjs
      # The desktop tests verify signed bundles with the stack's generated key.
      - name: Export the dev signing public key
        run: |
          key=$(sed -n 's/^IXTABLE_CLOUD_PUBLIC_KEY_RAW=//p' supabase/functions/.env.local)
          test -n "$key"
          echo "IXTABLE_CLOUD_PUBLIC_KEY_RAW=$key" >> "$GITHUB_ENV"
      # Deno module cache for the Edge Function type check and tests.
      - name: Cache Deno modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/deno.json', 'supabase/functions/deno.lock', 'scripts/cloud/deno-test.mjs') }}
          restore-keys: deno-${{ runner.os }}-
      # Deno comes from npm (npx deno@<pinned>) inside the script.
      - name: Edge Function type check and Deno unit tests
        run: node scripts/cloud/deno-test.mjs
      - name: Install website dependencies
        run: npm ci --prefix web
      # API-level specs only: no browser and no web server.
      - name: Service contract specs
        run: npm run service-qa:contracts --prefix web
      - name: Export Supabase env
        run: |
          STATUS=$(supabase status -o env)
          echo "SUPABASE_URL=$(echo "$STATUS" | sed -n 's/^API_URL=//p' | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(echo "$STATUS" | sed -n 's/^ANON_KEY=//p' | tr -d '"')" >> "$GITHUB_ENV"
      # The desktop cloud tests are #[ignore]d without a stack; the script runs them and
      # fails unless each one ran and passed.
      - name: Desktop cloud integration tests (Rust)
        run: node scripts/ci/run-ignored-rust-tests.mjs "Desktop cloud" cloud_live --test-threads=1
      - name: Supabase logs on failure
        if: failure()
        run: docker ps -a --format '{{.Names}}' | grep supabase | while read -r name; do echo "::group::$name"; docker logs --tail 200 "$name" 2>&1; echo "::endgroup::"; done
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-evidence
          path: web/test-results/service-qa/
          if-no-files-found: ignore
          retention-days: 7
