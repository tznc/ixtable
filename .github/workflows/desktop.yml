name: Desktop

# Studio + local Runtime (PRD §6.1, §26.5): Windows, macOS, and Linux are all
# release-blocking, so every test job runs on all three.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'tests/fixtures/**'
      - 'golden/**'
      - 'scripts/**'
      - '.cargo/**'
      - 'sgconfig.yml'
      - 'test/**'
      - '.github/actions/setup-desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'tests/fixtures/**'
      - 'golden/**'
      - 'scripts/**'
      - '.cargo/**'
      - 'sgconfig.yml'
      - 'test/**'
      - '.github/actions/setup-desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Git Bash on Windows, so every step uses the same quoting rules.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Released archive fixtures are unchanged
        if: github.event_name == 'pull_request'
        run: node scripts/ci/check-archive-fixtures.mjs "${{ github.base_ref }}"
      - name: ast-grep rules
        run: npx --yes --package @ast-grep/cli@0.38.7 ast-grep scan --warning
      - name: ast-grep rule tests
        run: npx --yes --package @ast-grep/cli@0.38.7 ast-grep test
      - name: Unused public Rust functions
        run: node scripts/ci/unused-pub-rust.mjs
      - name: Release and CI script tests
        run: node --test "scripts/tests/*.test.mjs"
      # Automated release gates (docs/release-checklist.md); human sign-offs print as pending.
      - name: Release gates (automated)
        run: node scripts/ci/release-gates.mjs

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF endings so fixtures and snapshots match on Windows.
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
      # The 500 MB archive boundary (docs/decisions/archive-format.md) is #[ignore]d
      # and always runs here: about a minute and 1.5 GB of temp disk. The script
      # fails unless every ignored test under the filter ran and passed.
      - name: 500 MB archive boundary (Rust)
        env:
          IXTABLE_HEAVY_TESTS: '1'
        run: node scripts/ci/run-ignored-rust-tests.mjs "500 MB boundary" durability_tests::heavy
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}
          path: scripts/screenshot/.generated/
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    name: PostgreSQL conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ixtable
          # Distinct from every other value so tests can assert it never lands in a document.
          POSTGRES_PASSWORD: pg-secret-7f3a
          POSTGRES_DB: ixtable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ixtable -d ixtable_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IXTABLE_TEST_POSTGRES_URL: postgresql://ixtable:pg-secret-7f3a@localhost:5432/ixtable_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      # The RecordStore conformance suite runs every scenario on SQLite and on
      # PostgreSQL (reads via DuckDB), and the UI tests that need a server (datasource,
      # bundles) run with it. The PostgreSQL tests are #[ignore]d; the script runs them
      # and fails unless each one ran and passed.
      - name: RecordStore conformance (Rust)
        run: node scripts/ci/run-ignored-rust-tests.mjs "PostgreSQL conformance" recordstore postgres migrations data --skip perf_tests --skip screenshots

  # Service containers are Linux-only, so macOS and Windows start PostgreSQL
  # natively (scripts/ci/start-postgres.mjs exports IXTABLE_TEST_POSTGRES_URL).
  # Main only: PRs get PostgreSQL coverage from the ubuntu job, freeing macOS/Windows runners.
  postgres-native:
    name: PostgreSQL conformance (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF endings so fixtures and snapshots match on Windows.
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      - name: Start PostgreSQL
        run: node scripts/ci/start-postgres.mjs
      - name: RecordStore conformance (Rust)
        run: node scripts/ci/run-ignored-rust-tests.mjs "PostgreSQL conformance" recordstore postgres migrations data --skip perf_tests --skip screenshots

  # PRs run golden apps on ubuntu only to free macOS/Windows runners; main runs all three.
  golden:
    name: Golden apps (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF endings so fixtures and snapshots match on Windows.
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      # CRM, inventory, and work-order journeys (PRD §26). Fails when no golden test runs.
      - name: Golden application suite
        working-directory: src-tauri
        run: |
          cargo test --lib ui::golden -- --list | tee golden-tests.txt
          grep -q ': test$' golden-tests.txt
          cargo test --lib ui::golden
      # Journey evidence (steps, assertions, failure log tail) is release evidence,
      # so it is uploaded on success too.
      - name: Upload golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evidence-${{ matrix.os }}
          path: tests/golden-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  # Performance budgets (PRD §27.3, docs/decisions/performance-budgets.md). Report-only:
  # results go to the job summary and an artifact, and a budget miss never fails CI.
  # Runs on main only: a report-only release build is not worth a PR runner.
  perf:
    name: Performance budgets (report-only)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ixtable
          POSTGRES_PASSWORD: pg-secret-7f3a
          POSTGRES_DB: ixtable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ixtable -d ixtable_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IXTABLE_PERF: '1'
      IXTABLE_TEST_POSTGRES_URL: postgresql://ixtable:pg-secret-7f3a@localhost:5432/ixtable_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
        with:
          cache-key: desktop-perf
      # Release build, like the shipped app; it also writes the fixture the UI harness opens.
      - name: Rust harness
        run: node scripts/ci/run-ignored-rust-tests.mjs --release "Performance harness" perf_tests --test-threads=1
      - name: Publish results
        if: always()
        run: node scripts/ci/perf-report.mjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-budgets
          path: |
            reports/perf/*.json
            reports/perf/summary.md
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Desktop binary links (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
        with:
          cache-key: desktop-build
      - name: tauri build (debug, no bundle)
        run: node scripts/tauri.mjs build --debug --no-bundle
