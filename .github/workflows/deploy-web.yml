name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"

defaults:
  run:
    shell: bash
    working-directory: web

concurrency:
  group: deploy-web-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ github.event_name == 'pull_request' && format('https://preview-{0}.ixtable.pages.dev', github.event.pull_request.number) || 'https://ixtable.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Docusaurus build
        uses: actions/cache@v4
        with:
          path: |
            web/.docusaurus
            web/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: docusaurus-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Build web app
        run: npm run build
        env:
          # Repository variable, not a secret. Unset means no analytics in the build.
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}

      - name: Publish production
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=ixtable --branch=main
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=ixtable --branch=preview-${{ github.event.pull_request.number }}
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse preview
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      # Lighthouse 13 needs Node 22.19 or newer; the runner default is older.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Pinned Lighthouse, the runner's preinstalled Chrome, and the new headless
      # mode. Chrome sometimes fails to open its debugging port on a cold
      # runner, so the launch is retried before the step fails.
      - name: Run Lighthouse against preview
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for attempt in 1 2 3; do
            if npx --yes lighthouse@13.5.0 "https://preview-${{ github.event.pull_request.number }}.ixtable.pages.dev" \
              --output html \
              --output-path /tmp/lighthouse-report.html \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu" \
              --max-wait-for-load=60000 \
              --quiet; then
              exit 0
            fi
            echo "Lighthouse attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Upload Lighthouse report
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: /tmp/lighthouse-report.html
          retention-days: 30

      - name: Comment preview and Lighthouse links on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://preview-${context.issue.number}.ixtable.pages.dev`;
            const artifactUrl = `${{ steps.upload.outputs.artifact-url }}`;
            const marker = '<!-- web-preview-link -->';
            const body = `${marker}\n🚀 Web preview: ${previewUrl}\n📊 Lighthouse report: ${artifactUrl}`;

            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
