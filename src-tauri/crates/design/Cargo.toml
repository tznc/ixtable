[package]
name = "ixtable-design"
version = "0.1.0"
description = "ixtable's design system: gpui-bootstrap re-themed, plus the app's own components."
license = "MIT"
edition = "2024"
publish = false

[dependencies]
# Bump in lockstep with gpui-bootstrap and the app's gpui-kit pin.
gpui-kit = "=0.7.3"
gpui-bootstrap = { git = "https://github.com/Ziinc/gpui-bootstrap", rev = "ffa67cfe69fd25d9cee5723d9cbef3af3be8f646" }
# Rendered previews in rustdoc (`--features styleguide`).
gpui-styleguidist = { git = "https://github.com/Ziinc/gpui-styleguidist", rev = "caa8b4e5a6b4b712af18400b0e6f33c3e840d4ce", default-features = false, features = ["macros"], optional = true }

[features]
styleguide = ["dep:gpui-styleguidist", "gpui-bootstrap/styleguide"]

# Native: tests, the styleguide window and PNG rendering.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
gpui-styleguidist = { git = "https://github.com/Ziinc/gpui-styleguidist", rev = "caa8b4e5a6b4b712af18400b0e6f33c3e840d4ce", features = ["gallery", "render"] }

# wasm32: the web styleguide published for QA (`cargo styleguide build`).
[target.'cfg(target_family = "wasm")'.dev-dependencies]
gpui-styleguidist = { git = "https://github.com/Ziinc/gpui-styleguidist", rev = "caa8b4e5a6b4b712af18400b0e6f33c3e840d4ce", features = ["web"] }

[[example]]
name = "styleguide"

