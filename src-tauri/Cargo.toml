[package]
name = "ixtable"
version = "0.1.0"
description = "ixtable desktop application"
authors = ["ixtable"]
edition = "2021"

[lib]
name = "ixtable_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
napi-build = "2"
# build.rs release key check (src/release_keys.rs).
base64 = "0.22"
serde_json = "1"

[features]
default = []
test-bridge = ["dep:tauri-test", "dep:napi", "dep:napi-derive"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-test = { version = "0.2.1", optional = true }
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
zstd = "0.13"
sha2 = "0.10"
# Unpacks the bundled DuckDB extension archives (data/extensions.rs).
flate2 = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
# Links the official prebuilt libduckdb (DUCKDB_LIB_DIR, .cargo/config.toml), which already
# includes the json and parquet readers used by file sources and imports.
duckdb = "=1.10505.0"
# Reads XLSX files in the import wizard (import/).
calamine = { version = "0.36", default-features = false }
# Writes XLSX exports (export/); constant_memory streams rows to a temp file instead of RAM.
rust_xlsxwriter = { version = "0.99", default-features = false, features = ["constant_memory"] }
# Access import (access/): template packages are OPC zips; Jet 3 text is windows-1252.
zip = { version = "8", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
codepage = "0.1"
tauri-plugin-dialog = "2"
# One app process per user: a second launch forwards its file arguments (lib.rs run()).
tauri-plugin-single-instance = "2"
# RecordStore: PostgreSQL write path (TLS via the platform stack) and the local
# datasource-credential store (uses chacha20poly1305 below; no custom primitives).
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
# Runtime bundles (bundle.rs): signatures, password KDF, AEAD, version checks.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
semver = "1"
# ixtable Cloud client (cloud/): HTTPS through rustls with the ring provider and the
# OS trust store (rustls-platform-verifier); blocking calls run off the UI thread.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "blocking", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Opens the browser for Google/Microsoft sign-in hand-off (PKCE).
tauri-plugin-opener = "2"
# Report PDFs (report_pdf.rs): embedded Unicode font subsets and PNG alpha masks.
ttf-parser = "0.25"
subsetter = { version = "0.2", default-features = false }
png = "0.18"

[target.'cfg(unix)'.dependencies]
# geteuid() for the owner check on key and secret files (paths.rs).
libc = "0.2"

[dev-dependencies]
proptest = "1.7"

# Desktop-only (PRD §6.2): no staticlib, and lean debug info keeps test-bridge builds small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
